# =============================================================================
# Gitea + Actions Runner
# =============================================================================
# Usage:
#   docker compose -f docker-compose.runner.yml up -d
#   docker compose -f docker-compose.runner.yml logs -f runner
#   docker compose -f docker-compose.runner.yml down
#
# Services:
#   - gitea-db: PostgreSQL untuk Gitea
#   - gitea: Git server (http://localhost:4000)
#   - runner: Gitea Actions Runner (execute CI/CD jobs)
#
# Network:
#   Semua service + job container share "gitea-net" network.
#   Job container akses Gitea via hostname "gitea" (Docker DNS alias).
#
# Persistence:
#   - gitea-db-data: PostgreSQL data
#   - gitea-data: Gitea repos, config, LFS
#   - gitea-runner-data: Runner registration (suppress re-register on restart)
# =============================================================================

services:
  gitea-db:
    image: postgres:15-alpine
    container_name: sast-gitea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-gitea}
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
    networks:
      - gitea-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 10

  gitea:
    image: gitea/gitea:latest
    container_name: sast-gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea}
      GITEA__server__DOMAIN: ${GITEA_PUBLIC_HOST:-localhost}
      GITEA__server__ROOT_URL: http://localhost:4000
      GITEA__server__HTTP_PORT: "4000"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "${GITEA_HTTP_PORT:-4000}:4000"
    volumes:
      - gitea-data:/data
    networks:
      gitea-net:
        aliases:
          - gitea
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  runner:
    image: gitea/act_runner:latest
    container_name: sast-gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://gitea:4000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN}
      CONFIG_FILE: /config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-config.yaml:/config.yaml:ro
      - gitea-runner-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gitea-net

networks:
  gitea-net:
    driver: bridge

volumes:
  gitea-db-data:
  gitea-data:
  gitea-runner-data:
