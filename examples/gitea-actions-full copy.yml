# =============================================================================
# Gitea Actions — Full SAST Scan (semgrep, gitleaks, flawfinder, cppcheck)
# =============================================================================
# Gitea Actions syntax (similar to GitHub Actions).
# Runs all 4 scanners in parallel, uploads combined results.
#
# Required Secrets (Repository Settings > Actions > Secrets):
#   SAST_API_URL       — e.g. https://sast.example.com/api/v1
#   SAST_WORKSPACE_ID  — workspace ID
#   SAST_PROJECT_ID    — repository ID in SAST
#   SAST_AUTH_TOKEN    — API token
# =============================================================================

name: SAST Security Scan

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * *'   # daily at 2 AM UTC

env:
  SAST_API_URL: ${{ secrets.SAST_API_URL }}
  SAST_WORKSPACE_ID: ${{ secrets.SAST_WORKSPACE_ID }}
  SAST_PROJECT_ID: ${{ secrets.SAST_PROJECT_ID }}
  SAST_AUTH_TOKEN: ${{ secrets.SAST_AUTH_TOKEN }}

jobs:
  # ─── Scanner 1: Semgrep (SAST) ────────────────────────────────────────────
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            --quiet \
            .
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.sarif
          retention-days: 1

  # ─── Scanner 2: Gitleaks (Secrets) ────────────────────────────────────────
  gitleaks:
    name: Gitleaks (Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for secret detection

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --log-opts="--since=2024-01-01" \
            --verbose
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks.sarif
          retention-days: 1

  # ─── Scanner 3: Flawfinder (C/C++ Sinks) ──────────────────────────────────
  flawfinder:
    name: Flawfinder (C/C++ Sinks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flawfinder
        run: pip install flawfinder

      - name: Run Flawfinder
        run: |
          # flawfinder JSON output
          flawfinder \
            --json \
            --error-level 1 \
            --columns \
            --data-only \
            . > flawfinder.json 2>/dev/null || echo '{"runs":[{"tool":{"driver":{"name":"flawfinder"}},"results":[]}]}' > flawfinder.json

          # Convert to SARIF
          python3 -c "
          import json

          with open('flawfinder.json') as f:
              data = json.load(f)

          results = []
          for item in data.get('runs', [{}])[0].get('results', []):
              results.append({
                  'ruleId': item.get('check', 'unknown'),
                  'message': {'text': item.get('message', '')},
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {'uri': item.get('file', '')},
                          'region': {'startLine': item.get('line', 0)}
                      }
                  }],
                  'level': 'warning'
              })

          sarif = {
              '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
              'version': '2.1.0',
              'runs': [{
                  'tool': {'driver': {'name': 'flawfinder', 'version': '2.0.8'}},
                  'results': results
              }]
          }

          with open('flawfinder.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          "
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flawfinder-results
          path: flawfinder.sarif
          retention-days: 1

  # ─── Scanner 4: Cppcheck (C/C++ Static Analysis) ─────────────────────────
  cppcheck:
    name: Cppcheck (C/C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck python3

      - name: Run Cppcheck
        run: |
          cppcheck \
            --enable=all \
            --inconclusive \
            --xml \
            --xml-version=2 \
            --output-file=cppcheck.xml \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            . 2>/dev/null || true

          # Convert XML to SARIF
          python3 -c "
          import xml.etree.ElementTree as ET
          import json, sys

          results = []
          try:
              tree = ET.parse('cppcheck.xml')
              root = tree.getroot()
              for error in root.findall('.//error'):
                  severity = error.get('severity', 'style')
                  msg = error.get('msg', '')
                  sid = error.get('id', '')
                  for loc in error.findall('location'):
                      fn = loc.get('file', '')
                      ln = int(loc.get('line', 0))
                      if fn:
                          results.append({
                              'ruleId': sid,
                              'message': {'text': msg},
                              'locations': [{
                                  'physicalLocation': {
                                      'artifactLocation': {'uri': fn},
                                      'region': {'startLine': ln}
                                  }
                              }],
                              'level': 'error' if severity == 'error' else 'warning'
                          })
          except Exception as e:
              print(f'Warning: {e}', file=sys.stderr)

          sarif = {
              '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
              'version': '2.1.0',
              'runs': [{
                  'tool': {'driver': {'name': 'cppcheck', 'version': '2.13'}},
                  'results': results
              }]
          }

          with open('cppcheck.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          "
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-results
          path: cppcheck.sarif
          retention-days: 1

  # ─── Upload to SAST API ───────────────────────────────────────────────────
  upload:
    name: Upload to SAST API
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks, flawfinder, cppcheck]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-results

      - name: Prepare and upload
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              Upload to SAST API                               ║"
          echo "╚════════════════════════════════════════════════════════════════╝"

          # Collect all SARIF files
          mkdir -p upload
          find scan-results -name "*.sarif" -exec cp {} upload/ \;

          echo "  Files to upload:"
          ls -la upload/

          FILES=""
          for f in upload/*.sarif; do
            if [ -f "$f" ]; then
              FILES="$FILES -F file=@$f;filename=$(basename $f)"
            fi
          done

          if [ -z "$FILES" ]; then
            echo "  ⚠ No SARIF files found, skipping upload"
            exit 0
          fi

          echo ""
          echo "  Uploading to SAST API..."

          RESPONSE=$(curl --fail-with-body \
            -X POST \
            "${SAST_API_URL}/workspaces/${SAST_WORKSPACE_ID}/scans/upload" \
            -H "Authorization: Bearer ${SAST_AUTH_TOKEN}" \
            -F "projectId=${SAST_PROJECT_ID}" \
            -F "repositoryUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -F "repositoryName=${GITHUB_REPOSITORY##*/}" \
            -F "branch=${GITHUB_REF_NAME}" \
            -F "commit=${GITHUB_SHA}" \
            -F "source=gitea_actions" \
            $FILES)

          echo ""
          echo "  Response: $RESPONSE"
          echo ""

          SCAN_ID=$(echo "$RESPONSE" | grep -o '"scanId":"[^"]*"' | cut -d'"' -f4)
          FINDINGS=$(echo "$RESPONSE" | grep -o '"findingsCount":[0-9]*' | cut -d':' -f2)

          echo "  ✓ Scan uploaded: $SCAN_ID"
          echo "  ✓ Findings: $FINDINGS"

      - name: Cleanup
        if: always()
        run: rm -rf scan-results upload
