# =============================================================================
# GitHub Actions — SAST Scan Upload
# =============================================================================
# This workflow runs SAST scanners on every push/PR and uploads results
# to the SAST Integration API. The API auto-registers the repository
# if it doesn't exist yet.
#
# Required Secrets:
#   SAST_API_URL       - Your SAST API base URL (e.g., https://sast.example.com/api/v1)
#   SAST_WORKSPACE_ID  - Your workspace ID
#   SAST_PROJECT_ID    - The project/repository ID in SAST
#   SAST_AUTH_TOKEN    - Your API authentication token
# =============================================================================

name: SAST Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  sast-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit
            p/owasp-top-ten
          generateSarif: true
        continue-on-error: true

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format sarif --report-path gitleaks.sarif
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy (Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
        continue-on-error: true

      - name: Upload Results to SAST API
        run: |
          echo "Uploading scan results to SAST API..."
          
          # Collect all SARIF files
          SARIF_FILES=""
          for f in semgrep.sarif gitleaks.sarif trivy.sarif; do
            if [ -f "$f" ]; then
              SARIF_FILES="$SARIF_FILES -F file=@$f;filename=$f"
            fi
          done
          
          if [ -z "$SARIF_FILES" ]; then
            echo "No SARIF files generated, skipping upload"
            exit 0
          fi
          
          # Upload to SAST API
          RESPONSE=$(curl --fail-with-body \
            -X POST \
            "${{ secrets.SAST_API_URL }}/workspaces/${{ secrets.SAST_WORKSPACE_ID }}/scans/upload" \
            -H "Authorization: Bearer ${{ secrets.SAST_AUTH_TOKEN }}" \
            -F "projectId=${{ secrets.SAST_PROJECT_ID }}" \
            -F "repositoryUrl=${{ github.server_url }}/${{ github.repository }}" \
            -F "repositoryName=${{ github.event.repository.name }}" \
            -F "branch=${{ github.ref_name }}" \
            -F "commit=${{ github.sha }}" \
            -F "source=github_actions" \
            $SARIF_FILES)
          
          echo "Upload response: $RESPONSE"
          
          # Extract scan ID for annotations
          SCAN_ID=$(echo "$RESPONSE" | jq -r '.data.scanId // empty')
          if [ -n "$SCAN_ID" ]; then
            echo "scan_id=$SCAN_ID" >> $GITHUB_OUTPUT
            echo "✓ Scan uploaded successfully: $SCAN_ID"
          fi

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

      - name: Clean up
        if: always()
        run: rm -f semgrep.sarif gitleaks.sarif trivy.sarif
