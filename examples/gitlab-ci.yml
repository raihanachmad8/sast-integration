# =============================================================================
# GitLab CI — SAST Scan Upload
# =============================================================================
# This pipeline runs SAST scanners on every push/merge request and uploads
# results to the SAST Integration API. The API auto-registers the repository
# if it doesn't exist yet.
#
# Required Variables (Settings > CI/CD > Variables):
#   SAST_API_URL       - Your SAST API base URL
#   SAST_WORKSPACE_ID  - Your workspace ID
#   SAST_PROJECT_ID    - The project/repository ID in SAST
#   SAST_AUTH_TOKEN    - Your API authentication token (masked)
# =============================================================================

stages:
  - scan
  - upload

variables:
  SEMGREP_CONFIG: "p/default p/security-audit"

# ─── Stage 1: Run Scanners ──────────────────────────────────────────────────

semgrep-sast:
  stage: scan
  image: semgrep/semgrep
  script:
    - semgrep scan
        --config $SEMGREP_CONFIG
        --sarif
        --output semgrep.sarif
        --quiet
        .
  artifacts:
    paths:
      - semgrep.sarif
    expire_in: 1 hour
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

gitleaks-secrets:
  stage: scan
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect
        --source .
        --report-format sarif
        --report-path gitleaks.sarif
        --verbose
  artifacts:
    paths:
      - gitleaks.sarif
    expire_in: 1 hour
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy-dependencies:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs
        --format sarif
        --output trivy.sarif
        --quiet
        .
  artifacts:
    paths:
      - trivy.sarif
    expire_in: 1 hour
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── Stage 2: Upload Results ────────────────────────────────────────────────

upload-to-sast:
  stage: upload
  image: curlimages/curl:latest
  needs:
    - job: semgrep-sast
      artifacts: true
      optional: true
    - job: gitleaks-secrets
      artifacts: true
      optional: true
    - job: trivy-dependencies
      artifacts: true
      optional: true
  script:
    - |
      echo "╔════════════════════════════════════════════════════════════════╗"
      echo "║              Uploading results to SAST API                   ║"
      echo "╚════════════════════════════════════════════════════════════════╝"
      
      # Build file arguments
      FILES=""
      for f in semgrep.sarif gitleaks.sarif trivy.sarif; do
        if [ -f "$f" ]; then
          FILES="$FILES -F file=@$f;filename=$f"
          echo "  Adding: $f"
        fi
      done
      
      if [ -z "$FILES" ]; then
        echo "No SARIF files found, skipping upload"
        exit 0
      fi
      
      # Upload to SAST API
      RESPONSE=$(curl --fail-with-body \
        -X POST \
        "${SAST_API_URL}/workspaces/${SAST_WORKSPACE_ID}/scans/upload" \
        -H "Authorization: Bearer ${SAST_AUTH_TOKEN}" \
        -F "projectId=${SAST_PROJECT_ID}" \
        -F "repositoryUrl=${CI_REPOSITORY_URL}" \
        -F "repositoryName=${CI_PROJECT_NAME}" \
        -F "branch=${CI_COMMIT_REF_NAME}" \
        -F "commit=${CI_COMMIT_SHA}" \
        -F "source=gitlab_ci" \
        $FILES)
      
      echo "Response: $RESPONSE"
      
      # Extract scan ID
      SCAN_ID=$(echo "$RESPONSE" | grep -o '"scanId":"[^"]*"' | cut -d'"' -f4)
      if [ -n "$SCAN_ID" ]; then
        echo "✓ Scan uploaded: $SCAN_ID"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
