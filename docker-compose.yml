# =============================================================================
# SAST Integration — Docker Compose
# =============================================================================
# PostgreSQL di-host external (cloud). Aplikasi connect via DATABASE_URL.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Required .env:
#   DATABASE_URL=postgresql://user:pass@host:5432/dbname
#   JWT_SECRET=<random-32+chars>
#   OWNER_EMAIL=<admin@email.com>
#   OWNER_PASSWORD=<secure-password>
#
# Optional .env (with scanners):
#   INCLUDE_SCANNERS=true
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - INCLUDE_SCANNERS=${INCLUDE_SCANNERS:-false}
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/storage/uploads
    volumes:
      - storage:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1G}
          cpus: ${APP_CPU_LIMIT:-1}
    networks:
      - sast-network

volumes:
  storage:

networks:
  sast-network:
    driver: bridge
